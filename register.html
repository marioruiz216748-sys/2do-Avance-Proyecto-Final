<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Backoffice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Crear cuenta</h1>

        <form id="formRegistro">
            <label for="name">Nombre completo:</label>
            <input type="text" id="name" minlength="6" required>

            <label for="email">Correo:</label>
            <input type="email" id="email" required>

            <label for="itsonId">Matrícula ITSON:</label>
            <input type="text" id="itsonId" minlength="6" maxlength="6"
                   pattern="[0-9]{6}" title="Escribe 6 números" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" minlength="6" required>

            <button type="submit">Registrarse</button>
        </form>

        <p>¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a></p>
        <p id="mensaje" class="mensaje" aria-live="polite"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
